name: Build iOSLauncherSystem APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Release/Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK to iOSLauncherSystem.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk iOSLauncherSystem.apk

      - name: Upload iOSLauncherSystem.apk
        uses: actions/upload-artifact@v4
        with:
          name: iOSLauncherSystem-APK
          path: iOSLauncherSystem.apk
