name: Build iOSLauncherSystem APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK to iOSLauncherSystem.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk iOSLauncherSystem.apk

      - name: Upload iOSLauncherSystem.apk
        uses: actions/upload-artifact@v4
        with:
          name: iOSLauncherSystem-APK
          path: iOSLauncherSystem.apk
